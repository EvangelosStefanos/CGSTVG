# Docker Compose version v2.29.7
services:
  cgstvg:
    image: cgstvg
    build: .
    volumes:
      - ./data:/app/data:ro
      - ./model_zoo:/app/model_zoo:ro
      - output-data:/app/output
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0', '1' ]
              capabilities: [ gpu ]
volumes:
  output-data:
